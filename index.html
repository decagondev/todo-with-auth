<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Login screen -->
  <section id="login-screen" class="screen">
    <form id="login-form" class="card" autocomplete="off">
      <h1>Sign in</h1>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <p id="login-error" class="error" role="alert" hidden></p>

      <button type="submit" class="btn-primary">Log in</button>
    </form>
  </section>

  <!-- Todo app screen -->
  <section id="app-screen" class="screen" hidden>
    <div class="card">
      <header class="app-header">
        <h1>My Todos</h1>
        <div class="user-box">
          <span id="who"></span>
          <button type="button" id="logout" class="btn-ghost">Log out</button>
        </div>
      </header>

      <form id="todo-form" class="todo-form" autocomplete="off">
        <input type="text" id="todo-input" placeholder="What needs doing?" required>
        <button type="submit" class="btn-primary">Add</button>
      </form>

      <div class="filters" id="filters">
        <button type="button" class="filter is-active" data-filter="all">All</button>
        <button type="button" class="filter" data-filter="active">Active</button>
        <button type="button" class="filter" data-filter="done">Done</button>
      </div>

      <ul id="todo-list" class="todo-list"></ul>

      <footer class="app-footer">
        <span id="count"></span>
        <button type="button" id="clear-done" class="btn-ghost">Clear completed</button>
      </footer>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
